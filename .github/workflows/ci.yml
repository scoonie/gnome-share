name: Continuous Integration

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout Code
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'config.example.yaml'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Build & Test Backend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # Gnome Share uses Node 24
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Generate Prisma Client (Database)
        env:
          DATABASE_URL: file:./data/gnome-share.db?connection_limit=1
        run: npx prisma generate

      - name: Build Backend
        run: npm run build

  test-frontend:
    name: Build & Test Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Build Frontend
        run: npm run build

  validate-config-example:
    name: Validate Generated Config Example
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./scripts/package-lock.json

      - name: Install Script Dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Generate Config Example
        working-directory: ./scripts
        run: npm run generate-example-config

      - name: Verify Config Example Is Current
        run: git diff --exit-code -- config.example.yaml
